# Sphere reads this on startup. Every trigger disabled by default.
# The operator flips `enabled: true` on the ones to run.
# All times America/Toronto.

version: 1
timezone: America/Toronto

triggers:
  - id: torus_daily_external_scan
    agent: torus
    cron: "0 7 * * *"
    enabled: true
    task: "Run daily external scan. Emit opportunity cards to reports/torus/YYYY-MM-DD.md."

  - id: torus_weekly_active_sweep
    agent: torus
    cron: "0 8 * * 1"
    enabled: true
    task: "Sweep active projects for signal. Emit revive/adjust cards."

  - id: torus_monthly_parked_sweep
    agent: torus
    cron: "0 8 1 * *"
    enabled: true
    task: "Sweep parked projects for revive candidates."

  - id: torus_quarterly_killed_recheck
    agent: torus
    cron: "0 8 1 1,4,7,10 *"
    enabled: true
    task: "Re-check killed projects for changed conditions."

  - id: mobius_daily_doc_drift
    agent: mobius
    cron: "0 22 * * *"
    enabled: true
    task: "Scan every repo for code/doc drift. Report if found."

  - id: mobius_weekly_sentinel
    agent: mobius
    cron: "0 9 * * 1"
    enabled: true
    task: "Produce the weekly portfolio sentinel report."

  - id: mobius_monthly_honesty
    agent: mobius
    cron: "0 9 1 * *"
    enabled: true
    task: "Produce the monthly honesty report."

  - id: sphere_morning_brief
    agent: sphere
    cron: "0 7 * * *"
    enabled: true
    task: "Post the operator's morning brief to Telegram."

  # EXTRACTED 2026-08-15: manifold moved into the Superlearn repo and now runs
  # there on GitHub Actions (manifold/ in github.com/snowfranco/Superlearn;
  # workflows manifold-edition.yml Tue/Fri 07:00 America/Toronto and
  # manifold-sweep.yml hourly). Both triggers below are disabled so this
  # scheduler never double-runs the agent. The source under agents/manifold/
  # is preserved (see its README) but no longer scheduled. Do not re-enable:
  # re-enabling would produce competing editions against the same Supabase.
  - id: manifold_edition
    agent: manifold
    cron: "0 7 * * 2,5"
    enabled: false
    task: "ARCHIVED: moved to the Superlearn repo (manifold/, GitHub Actions manifold-edition.yml). Do not re-enable."

  - id: manifold_outbox_sweep
    agent: manifold
    cron: "0 * * * *"
    enabled: false
    task: "ARCHIVED: moved to the Superlearn repo (manifold/, GitHub Actions manifold-sweep.yml). Do not re-enable."
