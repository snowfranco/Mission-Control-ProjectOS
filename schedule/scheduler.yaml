# Sphere reads this on startup. Every trigger disabled by default.
# The operator flips `enabled: true` on the ones to run.
# All times America/Toronto.

version: 1
timezone: America/Toronto

triggers:
  - id: torus_daily_external_scan
    agent: torus
    cron: "0 7 * * *"
    enabled: true
    task: "Run daily external scan. Emit opportunity cards to reports/torus/YYYY-MM-DD.md."

  - id: torus_weekly_active_sweep
    agent: torus
    cron: "0 8 * * 1"
    enabled: true
    task: "Sweep active projects for signal. Emit revive/adjust cards."

  - id: torus_monthly_parked_sweep
    agent: torus
    cron: "0 8 1 * *"
    enabled: true
    task: "Sweep parked projects for revive candidates."

  - id: torus_quarterly_killed_recheck
    agent: torus
    cron: "0 8 1 1,4,7,10 *"
    enabled: true
    task: "Re-check killed projects for changed conditions."

  - id: mobius_daily_doc_drift
    agent: mobius
    cron: "0 22 * * *"
    enabled: true
    task: "Scan every repo for code/doc drift. Report if found."

  - id: mobius_weekly_sentinel
    agent: mobius
    cron: "0 9 * * 1"
    enabled: true
    task: "Produce the weekly portfolio sentinel report."

  - id: mobius_monthly_honesty
    agent: mobius
    cron: "0 9 1 * *"
    enabled: true
    task: "Produce the monthly honesty report."

  - id: sphere_morning_brief
    agent: sphere
    cron: "0 7 * * *"
    enabled: true
    task: "Post the operator's morning brief to Telegram."

  # Enabled by the operator 2026-08-12 (reader-loop build prompt): editions
  # Tuesday and Friday 07:00, outbox sweep hourly. Flip enabled: false to
  # pause either one.
  - id: manifold_edition
    agent: manifold
    cron: "0 7 * * 2,5"
    enabled: true
    task: "Run the Superlearn editorial pass (Tuesday and Friday edition): cd agents/manifold && npm run edition. Writes one gated edition plus themes to Supabase; report to reports/manifold/."

  - id: manifold_outbox_sweep
    agent: manifold
    cron: "0 * * * *"
    enabled: true
    task: "Route the Superlearn outbox: cd agents/manifold && npm run outbox. Applies parks, notes, reading signals, and theme assignments; routes decisions and handoffs into queues/."
